# docker-compose.yml

version: '3.9'

services:

  # ── 1. PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: khoa_luan_db
    restart: unless-stopped

    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: 181004
      POSTGRES_DB:       khoa_luan_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khoa_luan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. FastAPI Backend ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: my_app/Dockerfile
    container_name: khoa_luan_api
    restart: unless-stopped

    environment:
      # ── Database ─────────────────────────────────────────────
      DATABASE_URL: postgresql://postgres:181004@db:5432/khoa_luan_db

      # ── JWT ──────────────────────────────────────────────────
      SECRET_KEY:   970faa09e32c07af0833a5c1a30a2c24e8bb6dc80dfc49aa285d7cdfce02fbf4
      DEBUG:        "true"

      # ── Email ─────────────────────────────────────────────────
      MAIL_USERNAME: hoangthanhphongsn04@gmail.com
      MAIL_PASSWORD: hsrd wpue qkmy vcet
      MAIL_FROM:     hoangthanhphongsn04@gmail.com

      # ── Cloudinary ────────────────────────────────────────────
      CLOUDINARY_CLOUD_NAME: dot7myffd
      CLOUDINARY_API_KEY:    451421479289569
      CLOUDINARY_API_SECRET: 9qoj7yMosnGU_kRokduaQvgQGws

    ports:
      - "8000:8000"

    volumes:
      - ./my_app:/app

    depends_on:
      db:
        condition: service_healthy

# ── Volumes ────────────────────────────────────────────────────
volumes:
  postgres_data: